<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F7F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1513" media="(prefers-color-scheme: dark)" />
    <title>Capitalis</title>
    <!-- Ícono de la pestaña: SVG (nítido en cualquier tamaño), PNG para navegadores sin SVG e ícono de iOS -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Aplica el tema antes de pintar para evitar un destello del tema equivocado.
      try {
        var t = localStorage.getItem('capitalis-theme') || 'system'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
