# Postgres local para desarrollo. En producción la base es Supabase.
# "name" fijo: el proyecto y el volumen siguen siendo "capitalis" / "capitalis_pgdata".
name: capitalis

services:
  db:
    image: postgres:16-alpine
    container_name: capitalis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-capitalis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capitalis}
      POSTGRES_DB: ${POSTGRES_DB:-capitalis}
    ports:
      # 5433: el 5432 suele estar ocupado por otro Postgres. Coincide con DATABASE_URL de .env.example.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
